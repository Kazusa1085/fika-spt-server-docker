name: Build and publish SPT + Fika image

# 在 GitHub 的 runner 上构建镜像并推送到 GHCR。
# runner 就在 GHCR 旁边，速度是满速 —— 这是发布给别人拉取的正确方式。
#
# 触发方式：
#   1. 手动（Actions 页面点 Run workflow，可指定版本）
#   2. 推送到 master / main 分支
#   3. 推送 v* 标签
#
# 产出：ghcr.io/kazusa1085/fika-spt-server-docker:<tag>
# 注意：GHCR 要求镜像路径全小写，而 GitHub 用户名可能含大写
#      （本仓库是 Kazusa1085），所以下面统一转成小写。

on:
  workflow_dispatch:
    inputs:
      spt_version:
        description: "SPT version (base image tag)"
        required: true
        default: "4.1.5"
      fika_version:
        description: "Fika server mod version"
        required: true
        default: "2.4.1"
  push:
    # 仓库默认分支是 master（不是 main）
    # 注意：GitHub Actions 不允许 paths 过滤器与 tags 同时使用，所以这里不设 paths
    branches: [master, main]
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 的镜像路径必须全小写；${VAR,,} 是 bash 的小写展开
      - name: Compute image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve versions
        id: versions
        env:
          INPUT_SPT: ${{ github.event.inputs.spt_version }}
          INPUT_FIKA: ${{ github.event.inputs.fika_version }}
        run: |
          SPT="${INPUT_SPT:-4.1.5}"
          FIKA="${INPUT_FIKA:-2.4.1}"
          echo "spt=$SPT"   >> "$GITHUB_OUTPUT"
          echo "fika=$FIKA" >> "$GITHUB_OUTPUT"
          echo "使用 SPT $SPT + Fika $FIKA，镜像名 ghcr.io/${{ steps.image.outputs.name }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fika
          push: true
          # 官方基底镜像是多架构的，两种都构建，x86 / ARM 的 NAS 都能用
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.image.outputs.name }}:latest
            ghcr.io/${{ steps.image.outputs.name }}:${{ steps.versions.outputs.spt }}
            ghcr.io/${{ steps.image.outputs.name }}:fika-${{ steps.versions.outputs.fika }}
            ghcr.io/${{ steps.image.outputs.name }}:${{ steps.versions.outputs.spt }}-fika${{ steps.versions.outputs.fika }}
          build-args: |
            SPT_VERSION=${{ steps.versions.outputs.spt }}
            FIKA_VERSION=${{ steps.versions.outputs.fika }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## 镜像已发布"
            echo
            echo '```'
            echo "docker pull ghcr.io/${{ steps.image.outputs.name }}:${{ steps.versions.outputs.spt }}-fika${{ steps.versions.outputs.fika }}"
            echo '```'
            echo
            echo "- SPT: \`${{ steps.versions.outputs.spt }}\`"
            echo "- Fika: \`${{ steps.versions.outputs.fika }}\`"
            echo
            echo "> ⚠️ 首次发布后需在 GitHub 把该 package 的可见性改成 **Public**，否则别人无法拉取。"
          } >> "$GITHUB_STEP_SUMMARY"
