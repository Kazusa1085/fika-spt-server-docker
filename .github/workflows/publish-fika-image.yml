name: Build and publish SPT + Fika image

# 在 GitHub 的 runner 上构建镜像并推送到 GHCR。
# runner 就在 GHCR 旁边，速度是满速 —— 这是发布给别人拉取的正确方式。
#
# 触发方式：
#   1. 手动（Actions 页面点 Run workflow，可指定版本）
#   2. 推送到 main 分支
#   3. 推送 v* 标签
#
# 产出：ghcr.io/<owner>/<repo>:<tag>

on:
  workflow_dispatch:
    inputs:
      spt_version:
        description: "SPT version (base image tag)"
        required: true
        default: "4.1.5"
      fika_version:
        description: "Fika server mod version"
        required: true
        default: "2.4.1"
  push:
    # 仓库默认分支是 master（不是 main）
    # 注意：GitHub Actions 不允许 paths 过滤器与 tags 同时使用，所以这里不设 paths
    branches: [master, main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve versions
        id: versions
        run: |
          SPT="${{ github.event.inputs.spt_version || '4.1.5' }}"
          FIKA="${{ github.event.inputs.fika_version || '2.4.1' }}"
          echo "spt=$SPT"   >> "$GITHUB_OUTPUT"
          echo "fika=$FIKA" >> "$GITHUB_OUTPUT"
          echo "使用 SPT $SPT + Fika $FIKA"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.fika
          push: true
          # 官方基底镜像是多架构的，这里两种都构建，x86 / ARM 的 NAS 都能用
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.spt }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:fika-${{ steps.versions.outputs.fika }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.spt }}-fika${{ steps.versions.outputs.fika }}
          build-args: |
            SPT_VERSION=${{ steps.versions.outputs.spt }}
            FIKA_VERSION=${{ steps.versions.outputs.fika }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## 镜像已发布"
            echo
            echo '```'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.spt }}-fika${{ steps.versions.outputs.fika }}"
            echo '```'
            echo
            echo "- SPT: \`${{ steps.versions.outputs.spt }}\`"
            echo "- Fika: \`${{ steps.versions.outputs.fika }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
